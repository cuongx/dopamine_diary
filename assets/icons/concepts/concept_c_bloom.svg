<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E54CE"/>
      <stop offset="1" stop-color="#463CA0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- dopamine bloom: 4 tier petals around a calm center -->
  <g transform="translate(512 512) rotate(45)">
    <!-- vertical pair -->
    <rect x="-58" y="-258" width="116" height="206" rx="58" fill="#E24B4A"/>
    <rect x="-58" y="52"  width="116" height="206" rx="58" fill="#97C459"/>
    <!-- horizontal pair -->
    <rect x="-258" y="-58" width="206" height="116" rx="58" fill="#EF9F27"/>
    <rect x="52"  y="-58" width="206" height="116" rx="58" fill="#378ADD"/>
    <!-- center -->
    <circle r="92" fill="#FAF9F5"/>
    <circle r="34" fill="#534AB7"/>
  </g>
</svg>
